name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The repo default is a read-only token, which cannot cut a release. Scoped to
    # this job rather than raised repo-wide.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # No wrapper jar is committed, so signing config comes from env instead of
      # a properties file. Without the secrets the build falls back to the debug key.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/revive.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/revive.p12" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "No KEYSTORE_B64 secret set; falling back to the debug signing key"
          fi

      - name: Version this build from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Name the artifact
        id: apk
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$src" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          out="byd-adas-revive-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Report signer
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs -v "${{ steps.apk.outputs.path }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: byd-adas-revive-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" \
            --target feat/initial-app \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --clobber
